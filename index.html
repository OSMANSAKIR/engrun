<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Sayfa yalnızca kendi dosyalarını ve (kullanıcı anahtar girerse) api.anthropic.com'u kullanabilir. Dış script, font, iframe yok. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://api.anthropic.com; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>YDS Koşusu</title>
<meta name="description" content="YDS, e-YDS ve YÖKDİL için oyunlaştırılmış, araştırmaya dayalı çalışma: açıklamalı sorular, aralıklı tekrar, seviye testi ve kişisel yol haritası.">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: one centered column (max 760px). A "night arcade table" HUD sits on top while playing;
   the question card itself stays calm and high-contrast so reading is never disturbed. */
:root {
  /* dark-first: the arcade lives at night */
  --bg: #0c0e19;
  --table: #111a2c;
  --surface: #171c2e;
  --surface-2: #1f2640;
  --line: #2c3456;
  --ink: #eef0ff;
  --muted: #9ba4c7;
  --chip: #3fd8f7;      /* chips: cool neon cyan */
  --mult: #ff4f9b;      /* multiplier: hot magenta */
  --flame: #ff8b3d;     /* combo flame */
  --gold: #ffc847;      /* score, primary action */
  --good: #45e3a4;
  --bad: #ff5c70;
  --on-gold: #1d1400;
  --mark: rgba(255, 200, 71, .28);
  --glow: 0 0 0 1px rgba(63, 216, 247, .25), 0 8px 30px rgba(63, 216, 247, .08);
  --shadow: 0 10px 30px rgba(0, 0, 0, .35);
  --font-display: "Bungee", "Arial Black", Impact, system-ui, sans-serif;
  --font-body: "Nunito", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 14px;
  --r-sm: 10px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #eceef7; --table: #dfe5f3; --surface: #ffffff; --surface-2: #f3f5fc; --line: #d2d8ea;
    --ink: #141a30; --muted: #565f82; --chip: #0a86aa; --mult: #cc1f69; --flame: #c95008;
    --gold: #a86a00; --good: #0b8f5c; --bad: #cf2741; --on-gold: #ffffff; --mark: rgba(255, 190, 40, .38);
    --glow: 0 0 0 1px rgba(10, 134, 170, .18), 0 6px 20px rgba(20, 30, 80, .06);
    --shadow: 0 8px 24px rgba(20, 30, 80, .10);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #eceef7; --table: #dfe5f3; --surface: #ffffff; --surface-2: #f3f5fc; --line: #d2d8ea;
  --ink: #141a30; --muted: #565f82; --chip: #0a86aa; --mult: #cc1f69; --flame: #c95008;
  --gold: #a86a00; --good: #0b8f5c; --bad: #cf2741; --on-gold: #ffffff; --mark: rgba(255, 190, 40, .38);
  --glow: 0 0 0 1px rgba(10, 134, 170, .18), 0 6px 20px rgba(20, 30, 80, .06);
  --shadow: 0 8px 24px rgba(20, 30, 80, .10);
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  -webkit-tap-highlight-color: transparent; overflow-x: hidden;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--chip); outline-offset: 2px; }
h1, h2, h3, h4 { margin: 0; line-height: 1.2; text-wrap: balance; }
p { margin: 0; }
.display { font-family: var(--font-display); font-weight: 400; letter-spacing: .02em; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.eyebrow { font-family: var(--font-mono); font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.wrap { width: 100%; max-width: 760px; margin: 0 auto; padding-inline: 16px; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1 1 auto; min-width: 0; }
[hidden] { display: none !important; }

/* ---------- header ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.topbar .wrap { display: flex; align-items: center; gap: 10px; padding-block: 10px; }
.logo { font-family: var(--font-display); font-size: 19px; letter-spacing: .03em; line-height: 1; white-space: nowrap; }
.logo b { color: var(--gold); font-weight: 400; }
.logo i { color: var(--chip); font-style: normal; }
.pill {
  display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px;
  background: var(--surface); border: 1px solid var(--line); font-size: 13px; white-space: nowrap;
}
.pill strong { font-family: var(--font-display); font-weight: 400; font-size: 15px; color: var(--gold); }
.iconbtn {
  width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface);
  display: inline-grid; place-items: center; flex: none;
}
.iconbtn svg { width: 20px; height: 20px; }

/* ---------- bottom nav ---------- */
main { padding-block: 18px 110px; }
.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  background: color-mix(in srgb, var(--surface) 94%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.nav .wrap { display: grid; grid-template-columns: repeat(6, 1fr); padding-inline: 4px; }
.nav button {
  border: 0; background: none; padding: 8px 0 9px; display: flex; flex-direction: column; align-items: center; gap: 3px;
  font-size: 11px; font-weight: 700; color: var(--muted); min-height: 56px;
}
.nav button svg { width: 22px; height: 22px; }
.nav button[aria-current="page"] { color: var(--ink); }
.nav button[aria-current="page"] svg { color: var(--gold); }
body.playing .nav, body.playing .topbar { display: none; }
body.playing main { padding-block: 0 120px; }

/* ---------- generic building blocks ---------- */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
.panel h3 { font-size: 15px; font-weight: 800; }
.section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 18px;
  border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); font-weight: 800; font-size: 15px;
  text-align: center;
}
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--gold); border-color: transparent; color: var(--on-gold); box-shadow: 0 4px 0 color-mix(in srgb, var(--gold) 55%, #000); }
.btn.primary:active { transform: translateY(2px); box-shadow: 0 2px 0 color-mix(in srgb, var(--gold) 55%, #000); }
.btn.cyan { background: color-mix(in srgb, var(--chip) 16%, var(--surface)); border-color: color-mix(in srgb, var(--chip) 50%, var(--line)); }
.btn.small { min-height: 38px; padding: 0 12px; font-size: 13.5px; border-radius: 10px; }
.btn.block { width: 100%; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chipbtn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 13px;
  font-size: 14px; font-weight: 700; min-height: 40px;
}
.chipbtn[aria-pressed="true"] { border-color: var(--chip); background: color-mix(in srgb, var(--chip) 18%, var(--surface)); }
.chipbtn small { color: var(--muted); font-weight: 600; margin-left: 4px; }
.tag { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 6px; background: var(--surface-2); color: var(--muted); }
.empty { padding: 18px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--r); }

/* ---------- Bugün ---------- */
.hero {
  position: relative; overflow: hidden; border-radius: 18px; padding: 20px 18px;
  background:
    radial-gradient(120% 140% at 100% 0%, color-mix(in srgb, var(--mult) 22%, transparent), transparent 55%),
    radial-gradient(90% 120% at 0% 100%, color-mix(in srgb, var(--chip) 18%, transparent), transparent 60%),
    var(--table);
  border: 1px solid var(--line);
  display: grid; grid-template-columns: 1fr auto; gap: 12px 18px; align-items: end;
}
.hero .big { font-family: var(--font-display); font-size: clamp(52px, 16vw, 84px); line-height: .9; color: var(--ink); }
.hero .big span { font-size: .38em; color: var(--chip); margin-left: 6px; }
.hero .sub { color: var(--muted); font-weight: 700; }
.predict { text-align: right; }
.predict .num { font-family: var(--font-display); font-size: 40px; line-height: 1; color: var(--gold); }
.gauge { grid-column: 1 / -1; position: relative; height: 12px; border-radius: 99px; background: color-mix(in srgb, var(--ink) 10%, transparent); }
.gauge > i { position: absolute; inset: 0 auto 0 0; border-radius: 99px; background: linear-gradient(90deg, var(--chip), var(--gold)); }
.gauge > b { position: absolute; top: -5px; bottom: -5px; width: 2px; background: var(--ink); }
.gauge-labels { grid-column: 1 / -1; position: relative; display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: -4px; }
.stats3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; min-width: 0; }
.stat .v { font-family: var(--font-display); font-size: 24px; line-height: 1.1; }
.stat .l { font-size: 12.5px; color: var(--muted); font-weight: 700; }
.task { display: grid; grid-template-columns: 30px 1fr; gap: 10px; padding: 12px 0; border-top: 1px solid var(--line); align-items: start; }
.task:first-of-type { border-top: 0; }
.task input { width: 22px; height: 22px; margin: 2px 0 0; accent-color: var(--good); }
.task .t { font-weight: 800; }
.task .d { color: var(--muted); font-size: 14px; }
.task .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.task.done .t { text-decoration: line-through; color: var(--muted); }
.weak { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.weak:first-of-type { border-top: 0; }
.weak .bar { grid-column: 1 / -1; height: 6px; border-radius: 9px; background: var(--surface-2); overflow: hidden; }
.weak .bar i { display: block; height: 100%; background: var(--bad); border-radius: 9px; }

/* ---------- Koşu lobby ---------- */
.gates { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.gate {
  position: relative; text-align: left; border: 1px solid var(--line); background: var(--table); border-radius: var(--r);
  padding: 12px; min-height: 92px; display: flex; flex-direction: column; gap: 4px;
}
.gate .n { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.gate .nm { font-weight: 800; line-height: 1.2; }
.gate .ch { font-size: 12.5px; color: var(--chip); font-weight: 700; margin-top: auto; }
.gate[aria-pressed="true"] { border-color: var(--gold); box-shadow: 0 0 0 2px color-mix(in srgb, var(--gold) 40%, transparent); }
.gate .badge { position: absolute; top: 10px; right: 10px; width: 22px; height: 22px; }
.gate:disabled { opacity: .4; }
.jokers { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
.jcard { perspective: 700px; min-height: 150px; }
.jcard .in { position: relative; height: 100%; min-height: 150px; transform-style: preserve-3d; transition: transform .6s cubic-bezier(.2,.8,.2,1); }
.jcard.flip .in { transform: rotateY(180deg); }
.jcard .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: var(--r); padding: 12px; display: flex; flex-direction: column; gap: 6px; border: 1px solid var(--line); }
.jcard .back { background: repeating-linear-gradient(45deg, var(--surface-2) 0 8px, var(--surface) 8px 16px); }
.jcard .front { transform: rotateY(180deg); background: linear-gradient(160deg, color-mix(in srgb, var(--mult) 22%, var(--surface)), var(--surface) 70%); border-color: color-mix(in srgb, var(--mult) 50%, var(--line)); }
.jcard .jn { font-family: var(--font-display); font-size: 14px; line-height: 1.15; }
.jcard .jd { font-size: 12.5px; color: var(--muted); line-height: 1.35; }
.jcard .prog { margin-top: auto; height: 6px; border-radius: 9px; background: var(--surface); overflow: hidden; }
.jcard .prog i { display: block; height: 100%; background: var(--chip); }
.hearts { display: inline-flex; gap: 3px; align-items: center; }
.hearts svg { width: 20px; height: 20px; }
.hearts .off { opacity: .2; }

/* ---------- play HUD ---------- */
.hud { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 15; background: var(--table); border-bottom: 1px solid var(--line); }
.hud .wrap { padding-block: 10px; display: flex; flex-direction: column; gap: 8px; }
.hud-top { display: flex; align-items: center; gap: 10px; }
.hud-title { flex: 1 1 auto; min-width: 0; }
.hud-title .g { font-family: var(--font-display); font-size: 15px; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hud-title .s { font-size: 12px; color: var(--muted); font-weight: 700; }
.hud-score { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; }
.cxm { display: inline-flex; align-items: stretch; gap: 4px; font-family: var(--font-display); font-size: 17px; }
.cxm .c, .cxm .m { padding: 3px 9px; border-radius: 8px; min-width: 44px; text-align: center; }
.cxm .c { background: color-mix(in srgb, var(--chip) 18%, transparent); color: var(--chip); }
.cxm .m { background: color-mix(in srgb, var(--mult) 18%, transparent); color: var(--mult); transition: color .3s, background .3s, box-shadow .3s; }
.cxm .m.hot { color: var(--flame); background: color-mix(in srgb, var(--flame) 22%, transparent); box-shadow: 0 0 14px color-mix(in srgb, var(--flame) 50%, transparent); }
.cxm .m.blaze { color: var(--gold); background: color-mix(in srgb, var(--flame) 35%, transparent); box-shadow: 0 0 22px color-mix(in srgb, var(--flame) 70%, transparent); }
.cxm .x { align-self: center; color: var(--muted); font-size: 13px; }
.target { min-width: 0; }
.target .tbar { height: 8px; border-radius: 9px; background: var(--surface-2); overflow: hidden; }
.target .tbar i { display: block; height: 100%; background: var(--gold); transition: width .5s; }
.target .tl { font-size: 12px; color: var(--muted); font-weight: 700; display: flex; justify-content: space-between; gap: 6px; }
.target .tl b { color: var(--ink); }
.slots { display: flex; gap: 6px; }
.slot { width: 30px; height: 40px; border-radius: 6px; border: 1px dashed var(--line); display: grid; place-items: center; font-family: var(--font-display); font-size: 11px; }
.slot.on { border: 1px solid color-mix(in srgb, var(--mult) 60%, var(--line)); background: color-mix(in srgb, var(--mult) 18%, var(--surface)); color: var(--mult); }

/* ---------- question ---------- */
.play { padding-block: 14px; display: flex; flex-direction: column; gap: 12px; }
.passage {
  position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px;
  max-height: 42vh; overflow-y: auto; font-size: 17px; line-height: 1.65; overscroll-behavior: contain;
}
.passage .ph { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 6px; position: sticky; top: -14px; background: var(--surface); padding-block: 4px; }
.blank { font-family: var(--font-mono); font-size: .82em; padding: 1px 5px; border-radius: 6px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.blank.cur { background: color-mix(in srgb, var(--chip) 25%, transparent); color: var(--ink); outline: 1px solid var(--chip); }
.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; box-shadow: var(--glow); }
.qmeta { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; }
.clock { font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); }
.clock.over { color: var(--bad); }
.stem { font-size: 18px; line-height: 1.6; white-space: pre-line; overflow-wrap: anywhere; }
.stem .gap, .passage .gap { color: var(--chip); font-weight: 800; letter-spacing: .05em; }
mark { background: var(--mark); color: inherit; border-radius: 4px; padding: 0 2px; box-shadow: 0 0 0 1px color-mix(in srgb, var(--gold) 50%, transparent); }
.opts { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
.opt {
  display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: start; text-align: left; width: 100%;
  min-height: 52px; padding: 11px 12px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface-2);
  font-size: 17px; line-height: 1.45;
}
.opt .L { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; font-family: var(--font-display); font-size: 14px; background: var(--surface); border: 1px solid var(--line); }
.opt .T { padding-top: 2px; overflow-wrap: anywhere; min-width: 0; }
.opt:hover:not(:disabled):not([aria-disabled="true"]) { border-color: color-mix(in srgb, var(--chip) 60%, var(--line)); }
.opt.picked { border-color: var(--chip); background: color-mix(in srgb, var(--chip) 12%, var(--surface-2)); }
.opt.picked .L { background: var(--chip); color: var(--bg); border-color: transparent; }
.opt.struck { opacity: .35; text-decoration: line-through; }
.opt.striking { border-style: dashed; }
.opt.correct { border-color: var(--good); background: color-mix(in srgb, var(--good) 14%, var(--surface-2)); }
.opt.correct .L { background: var(--good); color: var(--bg); border-color: transparent; }
.opt.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, var(--surface-2)); }
.opt.wrong .L { background: var(--bad); color: #fff; border-color: transparent; }
.opt.dim { opacity: .55; }
.opt:disabled, .opt[aria-disabled="true"] { cursor: default; }
/* bilinmeyen kelime işaretleme */
.marking .w { cursor: pointer; border-radius: 4px; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.marking .w:hover { background: color-mix(in srgb, var(--mult) 14%, transparent); }
.marking .stem, .marking .opt .T, .marking .passage { text-decoration: underline dotted color-mix(in srgb, var(--mult) 35%, transparent); text-underline-offset: 4px; }
.w.mk { background: color-mix(in srgb, var(--mult) 22%, transparent); box-shadow: inset 0 -2px 0 var(--mult); border-radius: 4px; padding: 0 1px; }
.answered .w.mk[data-tr]::after { content: " " attr(data-tr); font-size: .72em; font-weight: 800; color: var(--mult); white-space: normal; }
#markBtn[aria-pressed="true"] { border-color: var(--mult); background: color-mix(in srgb, var(--mult) 18%, var(--surface-2)); color: var(--ink); }
.mkw { display: flex; flex-wrap: wrap; gap: 6px; }
.mkw span { background: color-mix(in srgb, var(--mult) 10%, var(--surface-2)); border: 1px solid color-mix(in srgb, var(--mult) 40%, var(--line)); border-radius: 8px; padding: 4px 9px; font-size: 14.5px; }
.mkw span b { font-weight: 800; }
.mkw button { margin-left: 6px; color: var(--muted); font-weight: 800; }
.conf { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 8px; border-radius: 12px; background: var(--table); border: 1px solid var(--chip); margin-top: -2px; }
.conf .q { grid-column: 1 / -1; font-size: 12.5px; color: var(--muted); font-weight: 700; text-align: center; }
.conf button { min-height: 48px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 800; font-size: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; }
.conf button small { font-weight: 600; color: var(--muted); font-size: 11px; }
.conf .sure { border-color: color-mix(in srgb, var(--good) 60%, var(--line)); }
.conf .guess { border-color: color-mix(in srgb, var(--flame) 50%, var(--line)); }
.qtools { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; align-items: center; }
.history-note { font-size: 13px; color: var(--muted); margin-top: 8px; }

/* ---------- feedback ---------- */
.fb { display: flex; flex-direction: column; gap: 10px; }
.fb-head { border-radius: var(--r); padding: 14px 16px; display: flex; align-items: center; gap: 12px; }
.fb-head.good { background: color-mix(in srgb, var(--good) 16%, var(--surface)); border: 1px solid color-mix(in srgb, var(--good) 50%, var(--line)); }
.fb-head.bad { background: color-mix(in srgb, var(--bad) 14%, var(--surface)); border: 1px solid color-mix(in srgb, var(--bad) 50%, var(--line)); }
.fb-head .ic { font-family: var(--font-display); font-size: 26px; line-height: 1; }
.fb-head.good .ic { color: var(--good); }
.fb-head.bad .ic { color: var(--bad); }
.fb-head .ttl { font-family: var(--font-display); font-size: 18px; }
.fb-head .sub { font-size: 13.5px; color: var(--muted); font-weight: 700; }
.fb-block { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; font-size: 16.5px; }
.fb-block h4 { font-size: 13px; font-family: var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.fb-block.chosen { border-left: 4px solid var(--bad); }
.fb-block.answer { border-left: 4px solid var(--good); }
.fb-block .lead { font-weight: 800; }
.fb-block .opttext { font-style: italic; color: var(--muted); }
details.fb-block summary { cursor: pointer; font-weight: 800; font-size: 15px; list-style: none; display: flex; justify-content: space-between; gap: 8px; }
details.fb-block summary::-webkit-details-marker { display: none; }
details.fb-block summary::after { content: "+"; font-family: var(--font-mono); color: var(--muted); }
details.fb-block[open] summary::after { content: "–"; }
.others { display: flex; flex-direction: column; gap: 8px; margin: 0; padding: 0; list-style: none; }
.others li { display: grid; grid-template-columns: 26px 1fr; gap: 8px; font-size: 15.5px; }
.others li b { font-family: var(--font-display); font-weight: 400; color: var(--muted); }
.tip { border-left: 4px solid var(--gold); }
.vocab { display: flex; flex-wrap: wrap; gap: 6px; }
.vocab span { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 4px 9px; font-size: 14.5px; }
.vocab span b { font-weight: 800; }
.ai-out { white-space: pre-wrap; font-size: 15.5px; line-height: 1.55; }
.ai-row { display: flex; flex-wrap: wrap; gap: 8px; }
.note { font-size: 13px; color: var(--muted); }

.actionbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 25;
  background: color-mix(in srgb, var(--bg) 92%, transparent); border-top: 1px solid var(--line);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.actionbar .wrap { display: flex; gap: 8px; padding-block: 10px; }
.actionbar .btn { flex: 1 1 0; min-width: 0; }

/* ---------- score burst ---------- */
.burst {
  position: fixed; left: 50%; top: 34%; z-index: 60; transform: translate(-50%, -50%);
  display: flex; align-items: center; gap: 8px; padding: 14px 18px; border-radius: 16px;
  background: var(--table); border: 2px solid var(--gold); box-shadow: 0 0 40px color-mix(in srgb, var(--gold) 35%, transparent);
  font-family: var(--font-display); font-size: 30px; pointer-events: none; white-space: nowrap;
}
.burst .c { color: var(--chip); } .burst .m { color: var(--mult); } .burst .t { color: var(--gold); } .burst .x { color: var(--muted); font-size: 20px; }
.burst.pop { animation: pop .9s cubic-bezier(.2,.9,.3,1.3) both; }
@keyframes pop { 0% { transform: translate(-50%, -50%) scale(.6); opacity: 0; } 25% { transform: translate(-50%, -50%) scale(1.08); opacity: 1; } 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; } }
.shake { animation: shake .35s; }
@keyframes shake { 0%,100% { transform: none; } 25% { transform: translate(-3px, 1px); } 50% { transform: translate(3px, -1px); } 75% { transform: translate(-2px, 0); } }
.confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 90; }
/* ---------- Hedef ve yol haritası ---------- */
.goalpick { display: grid; gap: 8px; }
.goalpick .gx { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 11px 14px; display: grid; gap: 2px; }
.goalpick .gx b { font-family: var(--font-display); font-weight: 400; font-size: 18px; }
.goalpick .gx span { color: var(--muted); font-size: 13.5px; }
.goalpick .gx[aria-checked="true"] { border-color: var(--chip); background: color-mix(in srgb, var(--chip) 16%, var(--surface)); }
.goalbox { display: flex; flex-direction: column; gap: 12px; }
.goalbox .lbl { font-weight: 800; font-size: 14px; margin-bottom: -4px; }
.goalbox select, .goalbox input[type="date"] { min-height: 42px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); padding: 0 10px; color: var(--ink); font: inherit; }
.goalbox .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.goalbox .two label { display: grid; gap: 4px; }
.phases { display: grid; gap: 8px; margin-top: 8px; }
.phase { display: grid; grid-template-columns: 12px 1fr; gap: 2px 10px; }
.phase i { grid-row: span 2; width: 10px; height: 10px; margin-top: 6px; border-radius: 50%; border: 2px solid var(--chip); }
.phase.now i { background: var(--chip); }
.phase b { font-size: 14.5px; }
.phase span { color: var(--muted); font-size: 13.5px; }
.week { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 0; }
.week li { display: grid; grid-template-columns: 92px 1fr; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
.week li:first-child { border-top: 0; }
.week li .d { color: var(--muted); font-weight: 700; }
.week li.today .d { color: var(--chip); }

.keybox { display: flex; flex-direction: column; gap: 10px; padding-top: 12px; border-top: 1px solid var(--line); }
.keybox input[type="password"], .keybox input[type="text"] { min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); padding: 0 12px; font-family: var(--font-mono); font-size: 14px; width: 100%; color: var(--ink); }
.keybox .chk { display: flex; gap: 8px; align-items: center; font-size: 14.5px; }
.flash { position: fixed; inset: 0; z-index: 55; pointer-events: none; background: var(--bad); opacity: 0; }
.flash.on { animation: flash .45s ease-out; }
@keyframes flash { 0% { opacity: .35; } 100% { opacity: 0; } }
.heartbreak { animation: hb .5s; }
@keyframes hb { 30% { transform: scale(1.4) rotate(-12deg); } 100% { transform: none; } }

.overlay { position: fixed; inset: 0; z-index: 70; background: rgba(5, 6, 14, .62); display: grid; place-items: center; padding: 16px; }
.modal { width: 100%; max-width: 520px; max-height: 88vh; overflow-y: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 20px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 14px; }

.hbar .track i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 0 4px 4px 0; background: var(--chip); }
.hbar .track b { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); opacity: .7; }
.hbar .val { grid-column: 2; font-size: 12.5px; color: var(--muted); font-family: var(--font-mono); display: flex; justify-content: space-between; gap: 8px; }
.hbar .val .warn { color: var(--bad); font-family: var(--font-body); font-weight: 800; }
.hbar .val .ok { color: var(--good); font-family: var(--font-body); font-weight: 800; }
.spark { width: 100%; height: auto; display: block; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }

/* ---------- settings ---------- */
.setrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px; border-top: 1px solid var(--line); }
.setrow:first-of-type { border-top: 0; }
.switch { position: relative; width: 52px; height: 30px; flex: none; }
.switch input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; z-index: 1; }
.switch span { position: absolute; inset: 0; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); transition: background .2s; }
.switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--muted); transition: transform .2s, background .2s; }
.switch input:checked + span { background: color-mix(in srgb, var(--good) 35%, var(--surface-2)); }
.switch input:checked + span::after { transform: translateX(22px); background: var(--good); }
.switch input:focus-visible + span { outline: 2px solid var(--chip); outline-offset: 2px; }
input[type="range"] { width: 160px; accent-color: var(--gold); }
select { min-height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); padding: 0 10px; }

@media (min-width: 720px) {
  .stem { font-size: 19px; }
  .passage { max-height: 46vh; font-size: 18px; }
  .hero { padding: 26px; }
}

  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; scroll-behavior: auto !important; }
}

<script>
"use strict";
/* =========================================================
   1. Sabitler
   ========================================================= */
const SECTIONS = ["vocab","grammar","cloze","sentence","trans_en_tr","trans_tr_en","reading","dialogue","restatement","para_completion","irrelevant"];
const SEC = {
  vocab:           { tr: "Kelime",              short: "Kelime",     par: 35,  chips: 10, real: 6 },
  grammar:         { tr: "Gramer / Zamanlar",   short: "Gramer",     par: 45,  chips: 10, real: 10 },
  cloze:           { tr: "Paragrafta boşluk",   short: "Cloze",      par: 60,  chips: 15, real: 10 },
  sentence:        { tr: "Cümle tamamlama",     short: "Cümle",      par: 75,  chips: 15, real: 10 },
  trans_en_tr:     { tr: "Çeviri İng→Tr",       short: "İng→Tr",     par: 90,  chips: 20, real: 3 },
  trans_tr_en:     { tr: "Çeviri Tr→İng",       short: "Tr→İng",     par: 90,  chips: 20, real: 3 },
  reading:         { tr: "Okuma",               short: "Okuma",      par: 150, chips: 25, real: 20 },
  dialogue:        { tr: "Diyalog tamamlama",   short: "Diyalog",    par: 75,  chips: 15, real: 5 },
  restatement:     { tr: "Yakın anlam",         short: "Yakın anlam",par: 90,  chips: 20, real: 4 },
  para_completion: { tr: "Paragraf tamamlama",  short: "Paragraf",   par: 120, chips: 25, real: 4 },
  irrelevant:      { tr: "Anlam bozan cümle",   short: "Anlam bozan",par: 105, chips: 20, real: 5 }
};
const SLOW_SECTIONS = new Set(["reading","restatement","para_completion"]); // hedef %60, diğerleri %75
const DUCK_SECTIONS = new Set(["reading","cloze","para_completion","irrelevant","trans_en_tr","trans_tr_en","restatement"]);
// Sınav biçimleri: bölüm başına gerçek soru sayısı. Hepsi 80 soru, 180 dk, soru başı 1,25 puan.
// YÖKDİL'in ilk 20 sorusu kelime+gramer karışık; ÖSYM ayrım vermediği için yarı yarıya saydık.
// YÖKDİL'de diyalog ve yakın anlam bölümü yok.
const YDS_REAL = { vocab:6, grammar:10, cloze:10, sentence:10, trans_en_tr:3, trans_tr_en:3, reading:20, dialogue:5, restatement:4, para_completion:4, irrelevant:5 };
const EXAM_TYPES = {
  yds:    { name: "YDS",    desc: "Kâğıt sınav, yılda 2 kez", real: YDS_REAL },
  eyds:   { name: "e-YDS",  desc: "Bilgisayarda, yılda ~8 oturum; soru tipleri YDS ile aynı", real: YDS_REAL },
  yokdil: { name: "YÖKDİL", desc: "Akademik; metinler alanına göre (Fen, Sağlık, Sosyal)",
            real: { vocab:10, grammar:10, cloze:10, sentence:11, trans_en_tr:6, trans_tr_en:6, reading:15, dialogue:0, restatement:0, para_completion:6, irrelevant:6 },
            fields: { sosyal: "Sosyal Bilimler", saglik: "Sağlık Bilimleri", fen: "Fen Bilimleri" } }
};
// ÖSYM takvimi (2026 ve 2027, İngilizce oturumlar). Takvim değişebilir; başvurudan önce osym.gov.tr'den kontrol edilmeli.
const EXAM_CALENDAR = [
  { exam: "eyds",   label: "e-YDS 2026/12",            date: "2026-12-19" },
  { exam: "eyds",   label: "e-YDS 2027/1",             date: "2027-01-16" },
  { exam: "eyds",   label: "e-YDS 2027/2",             date: "2027-02-06" },
  { exam: "yokdil", label: "YÖKDİL 2027/1",            date: "2027-02-28" },
  { exam: "yds",    label: "YDS 2027/1",               date: "2027-03-28" },
  { exam: "eyds",   label: "e-YDS 2027/4",             date: "2027-04-24" },
  { exam: "yokdil", label: "e-YÖKDİL 2027 · Sosyal",   date: "2027-05-29", field: "sosyal" },
  { exam: "yokdil", label: "e-YÖKDİL 2027 · Sağlık",   date: "2027-05-30", field: "saglik" },
  { exam: "yokdil", label: "e-YÖKDİL 2027 · Fen",      date: "2027-06-05", field: "fen" },
  { exam: "eyds",   label: "e-YDS 2027/6",             date: "2027-06-26" },
  { exam: "yokdil", label: "YÖKDİL 2027/2",            date: "2027-07-25" },
  { exam: "eyds",   label: "e-YDS 2027/9",             date: "2027-08-21" },
  { exam: "eyds",   label: "e-YDS 2027/10",            date: "2027-09-25" },
  { exam: "eyds",   label: "e-YDS 2027/11",            date: "2027-10-16" },
  { exam: "yds",    label: "YDS 2027/2",               date: "2027-11-21" },
  { exam: "eyds",   label: "e-YDS 2027/12",            date: "2027-12-18" }
];
const TARGETS = [50, 55, 60, 65, 70, 75, 80, 90];
const DAILY_MIN = [30, 60, 90, 120];
const G = () => S().goal || null;                                   // { exam, field, date, label, target, minutes, start }
const examType = () => EXAM_TYPES[(G() || {}).exam] || EXAM_TYPES.yds;
const REAL = s => examType().real[s] || 0;
const examSections = () => SECTIONS.filter(s => REAL(s) > 0);
const goalTarget = () => (G() && G().target) || 70;
const parseDay = d => { const [y, m, dd] = d.split("-").map(Number); return new Date(y, m - 1, dd).getTime(); };
// Payları gerçek soru sayılarıyla orantılı dağıtır (en büyük kalan yöntemi); her bölüme en az `min` soru.
function scaleDist(total, min = 0) {
  const secs = examSections(), sum = secs.reduce((a, s) => a + REAL(s), 0);
  const out = {}; let used = 0;
  for (const s of secs) { out[s] = Math.max(min, Math.floor(REAL(s) * total / sum)); used += out[s]; }
  const rest = secs.map(s => [s, REAL(s) * total / sum - Math.floor(REAL(s) * total / sum)]).sort((a, b) => b[1] - a[1]);
  for (let i = 0; used < total && i < rest.length * 2; i++) { out[rest[i % rest.length][0]]++; used++; }
  return out;
}
const EXAM_DIST = {
  get half() { return scaleDist(40); },
  get full() { return examType().real; },
  // Seviye testi: her bölümden en az 1 soru, gerçek sınav oranlarına yakın; 28 soru · 65 dk
  get placement() { return scaleDist(28, 1); }
};
const EXAM_NAME = { full: "Tam deneme", half: "Yarım deneme", placement: "Seviye testi" };
const EXAM_MIN = { full: 180, half: 90, placement: 65 };
const LETTERS = ["A","B","C","D","E"];
const CONF = { sure: "Eminim", unsure: "Kararsızım", guess: "Tahmin" };

const TAG_TR = {

const DEFAULT_SETTINGS = { music: true, sfx: true, volume: 0.6, theme: "auto", vibrate: true, seenStrategy: {}, badges: {}, dayChecks: {}, jokersSeen: [], u: 0 };
const LS_KEY = "yds.v1";
const Store = {
  attempts: {}, srs: {}, runs: {}, gen: {}, words: {}, settings: { ...DEFAULT_SETTINGS },
  db: null, status: "local", dirty: new Set(), _t: null, _st: null,
  load() {
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (raw) {
        const d = JSON.parse(raw);
        for (const k of ["attempts", "srs", "runs", "gen", "words"]) if (d[k] && typeof d[k] === "object") this[k] = d[k];
        if (d.settings) this.settings = { ...DEFAULT_SETTINGS, ...d.settings };
      }

      if (dr) this.dirty = new Set(JSON.parse(dr));
    } catch (e) { console.warn("Yerel kayıt okunamadı", e); }
  },
  saveLocal() {
    clearTimeout(this._t);
    this._t = setTimeout(() => {
      try {
        localStorage.setItem(LS_KEY, JSON.stringify({ attempts: this.attempts, srs: this.srs, runs: this.runs, gen: this.gen, words: this.words, settings: this.settings }));
        localStorage.setItem(LS_KEY + ".dirty", JSON.stringify([...this.dirty]));
      } catch (e) {}

  },
  put(coll, id, doc) {
    doc.u = Date.now(); doc.id = id;
    if (coll === "settings") this.settings = doc; else this[coll][id] = doc;
    if (coll === "words") _vocabIdx = null;

    this.dirty.add(path); this.saveLocal();

  },
  setSettings(patch) { this.put("settings", "main", { ...this.settings, ...patch }); },
  async connect() {

    if (!cl || typeof cl.use !== "function") return;
    let db = null;
    try { db = await Promise.race([cl.use("db"), sleep(10000).then(() => null)]); } catch (e) { db = null; }
    if (!db) return;

  },

    for (const coll of ["attempts", "srs", "runs", "gen", "words"]) {
      const remote = await fetchColl(db, coll);
      const seen = new Set();
      for (const d of remote) {
        seen.add(d.id);
        const loc = this[coll][d.id];
        if (!loc || (d.u || 0) > (loc.u || 0)) this[coll][d.id] = d;
        else if ((loc.u || 0) > (d.u || 0)) this.dirty.add(coll + "/" + d.id);
      }
      for (const id of Object.keys(this[coll])) if (!seen.has(id)) this.dirty.add(coll + "/" + id);
    }
    const s = await db.doc("settings/main").get();
    if (s.exists) {
      const d = s.data();
      if ((d.u || 0) > (this.settings.u || 0)) this.settings = { ...DEFAULT_SETTINGS, ...d };

async function fetchColl(db, coll) {
  const out = []; let last = null;

    let q = db.collection(coll);

    const snap = await q.orderBy("u", "desc").limit(500).get();
    for (const d of snap.docs) out.push({ ...d.data(), id: d.id });

  if (!e) { e = { busy: false, again: false }; WQ.set(path, e); }
  if (e.busy) { e.again = true; return; }          // aynı dokümana eşzamanlı yazma yok
  e.busy = true; let tries = 0;
  do {

    const doc = coll === "settings" ? Store.settings : Store[coll] && Store[coll][id];
    if (!doc) break;

// Günün türü: sınava kalan gün (L) ve plan başından beri geçen gün (i) belirler.
// Uzak: 5 odak günü + 1 yarım deneme + 1 hafif gün. Son 35 gün: 4 günde bir yarım deneme.
// Son 14 gün: 4 tam deneme (14, 10, 7, 4 gün kala), son 3 gün kırmızı deste, son gün yeni konu yok.
function dayKind(L, i, minutes) {
  if (L != null) {
    if (L < 0) return "after";
    if (L === 0) return "exam";
    if (L === 1) return "eve";
    if (L <= 14) return [14, 10, 7, 4].includes(L) ? (minutes >= 90 ? "full" : "half") : L <= 3 ? "red" : "focus";
    if (L <= 35) return i % 4 === 3 ? "half" : "focus";
  }
  return i % 7 === 5 ? "half" : i % 7 === 6 ? "light" : "focus";
}
// Önümüzdeki n günün planı. Odak günlerinde bölüm seçimi: sınavda kaybettirdiği tahmini soru × ne zamandır çalışılmadığı.
// Böylece zayıf ve büyük bölümler (okuma gibi) sık, küçük bölümler daha seyrek ama düzenli gelir. Her gün yeniden hesaplanır.
function planDays(n) {
  const g = G() || {}; const L0 = daysLeft(); const t0 = startOfDay();
  const start = g.start ? parseDay(g.start) : t0;
  const all = allAttempts(); const atts = all.filter(a => a.ts < t0);
  const st = secStats(atts); const secs = examSections();
  const known = secs.filter(s => st[s].racc != null);
  const avg = known.length ? known.reduce((a, s) => a + st[s].racc, 0) / known.length : .5;
  const last = {}; for (const a of atts) if (a.mode !== "exam") last[a.section] = a.ts;
  const needPlacement = !S().placementTs && all.length < 30;
  const out = [];
  for (let k = 0; k < n; k++) {
    const day = t0 + k * DAY, L = L0 == null ? null : L0 - k, i = Math.max(0, Math.round((day - start) / DAY));
    const kind = k === 0 && needPlacement && (L == null || L > 1) ? "placement" : dayKind(L, i, g.minutes || 60);
    const e = { day, L, kind, secs: [] };
    if (kind === "focus") {
      const pr = secs.map(s => {
        const acc = st[s].racc != null ? st[s].racc : Math.min(avg, .5);
        const idle = last[s] ? Math.min(14, (day - last[s]) / DAY) : 14;
        return { s, acc, known: st[s].racc != null, gain: (1 - acc) * REAL(s), score: (1 - acc) * REAL(s) * (.25 + idle / 4) };
      }).sort((a, b) => b.score - a.score);
      const a = pr[0], b = pr.find(x => SLOW_SECTIONS.has(x.s) !== SLOW_SECTIONS.has(a.s)) || pr[1];
      e.secs = [a, b].filter(Boolean);
      for (const x of e.secs) last[x.s] = day;
    }
    out.push(e);
  }
  return out;
}
function planEntry(e) {
  const tip = sec => { const l = STRATEGY[sec].filter(t => !t.startsWith("⚠️")); return l[Math.round(e.day / DAY) % l.length]; };
  switch (e.kind) {
    case "placement": return { title: "Seviye testi", short: "Seviye testi", text: "28 soru, 65 dakika, her bölümden soru. Yol haritan bu sonuca göre hangi bölümle başlayacağını seçer.", acts: [["Seviye testine başla", "exam:placement"]], exam: 65 };
    case "half": return { title: "Yarım deneme", short: "Yarım deneme", text: "40 soru, 90 dakika, sessiz ve açıklamasız. Bitince hatalarını incele; sonraki günlerin planı bu sonuca göre değişir.", acts: [["Yarım denemeyi başlat", "exam:half"]], exam: 90 };
    case "full": return { title: "Tam deneme · sınav provası", short: "Tam deneme", text: "80 soru, 180 dakika, tek oturumda. Mümkünse sınavla aynı saatte başla; mola verme.", acts: [["Tam denemeyi başlat", "exam:full"]], exam: 180 };
    case "red": return { title: "Kırmızı deste ve zayıf konular", short: "Kırmızı deste", text: "Yeni bölüm açma. \"Eminim\" deyip yanıldığın sorular ve en zayıf etiketlerin.", acts: [["Tekrar destesi", "review"], ["Zayıf etiketler", "practice:weak"], ["Strateji kartları", "strategy"]] };
    case "eve": return { title: "Son gün: hafif tekrar", short: "Hafif tekrar", text: "Yeni konu yok. Kırmızı deste, strateji kartları ve kelimeler. Erken yat.", acts: [["Tekrar destesi", "review"], ["Strateji kartları", "strategy"]] };
    case "exam": return { title: "Sınav günü", short: "SINAV", text: "Sabah 15 dk strateji kartlarına bak. Kimliğini ve sınav giriş belgeni unutma. Başarılar!", acts: [["Strateji kartları", "strategy"]] };
    case "after": return { title: "Sınav geride kaldı", short: "—", text: "Sonucunu bekliyorsan ya da yeniden gireceksen yeni bir hedef seç; plan ona göre kurulsun.", acts: [["Yeni hedef seç", "goal"]] };
    case "light": return { title: "Hafif gün: tekrar ve kelime", short: "Hafif gün", text: "Haftanın yükünü hafiflet: vadesi gelen tekrarlar ve kelime kartları.", acts: [["Tekrar destesi", "review"], ["Kelime kartları", "vocab"]] };
  }
  const [a, b] = e.secs;
  const why = a.known ? `${SEC[a.s].tr} şu an %${Math.round(a.acc * 100)}; sınavda ~${Math.round(a.gain)} soru kaybettiriyor.` : `${SEC[a.s].tr} için henüz yeterli veri yok.`;
  return {
    title: b ? `${SEC[a.s].short} + ${SEC[b.s].short}` : SEC[a.s].short, short: b ? `${SEC[a.s].short} + ${SEC[b.s].short}` : SEC[a.s].short,
    text: `${why} İpucu: ${tip(a.s)}`,
    acts: [[`${SEC[a.s].short} antrenmanı`, "practice:" + a.s], ...(b ? [[`${SEC[b.s].short} antrenmanı`, "practice:" + b.s]] : []), ["Zayıf etiketler", "practice:weak"]]
  };
}

function screenToday() {
  const atts = allAttempts(); const p = predicted(atts);
  const g = G(); const days = daysLeft(); const target = goalTarget();
  const key = dayKey();
  const pe = planDays(1)[0]; const plan = planEntry(pe);
  const mins = (g && g.minutes) || 60; const part = r => Math.max(5, Math.round(mins * r / 5) * 5);
  const st = streakDays(); const due = dueQuestions().length;
  const weak = weakTags(atts, 3);
  const todayAtt = Object.values(Store.attempts).filter(a => a.ts >= startOfDay());
  const todayWrong = todayAtt.filter(a => !a.correct).length;
  const checks = (S().dayChecks || {})[key] || [false, false, false, false];
  const vd = vocabDeckInfo();
  const score = p.score;
  const gw = score == null ? 0 : clamp(score, 0, 100);
  // Günlük süre görevlere bölünür: ~%17 tekrar, ~%62 ana blok, ~%13 kelime, ~%8 hataların üstünden geçme.
  // Deneme günlerinde ana blok denemenin kendisidir.
  const review = { t: `${part(.17)} dk · Tekrar Destesi`, d: due ? `${due} soru vadesi geldi${srsBoxes().red ? `, ${srsBoxes().red} tanesi kırmızı` : ""}.` : "Vadesi gelen soru yok; yeni hata yaptıkça dolar.", acts: [["Desteyi aç", "review"]] };
  const words = { t: `${part(.13)} dk · Kelime kartları`, d: `${vd.due} tekrar, ${vd.fresh} yeni kelime hazır.`, acts: [["Kartları aç", "vocab"]] };
  const errs = { t: `${part(.08)} dk · Bugünün hataları`, d: todayWrong ? `Bugün ${todayWrong} yanlışın var. Açıklamalara son kez bak.` : "Bugün henüz yanlış yok.", acts: todayWrong ? [["Hataları incele", "todaywrong"]] : [] };
  const main = { t: `${plan.exam || part(.62)} dk · ${plan.title}`, d: plan.text, acts: plan.acts };
  const tasks = pe.kind === "after" || pe.kind === "exam" ? [main]
    : plan.exam ? [main, errs]
    : pe.kind === "red" || pe.kind === "eve" || pe.kind === "light" ? [{ ...main, t: `${mins} dk · ${plan.title}` }, words]
    : mins < 60 ? [main, words] : [review, main, words, errs];
  return `
  <section class="hero">
    <div>
      <p class="eyebrow">${g ? esc(g.label) + (g.date ? " · " + esc(fmtDay(parseDay(g.date))) : "") : "Hedef sınav seçilmedi"}</p>
      ${days == null ? `<div class="big" style="font-size:40px">${esc(examType().name)}</div><p class="sub">${g ? "tarih seçilmedi" : "sınavını ve tarihini seç"} · <button class="btn small" data-act="goal" style="vertical-align:middle">${g ? "Tarih seç" : "Seç"}</button></p>`
        : days > 0 ? `<div class="big">${days}<span>GÜN</span></div><p class="sub">sınava kaldı</p>` : days === 0 ? `<div class="big" style="font-size:44px">BUGÜN</div><p class="sub">Sınav günü. Sakin kal, stratejine güven.</p>` : `<div class="big" style="font-size:40px">BİTTİ</div><p class="sub">Sınav geride kaldı.</p>`}
    </div>
    <div class="predict">
      <p class="eyebrow">Tahmini puan</p>
      <div class="num">${score == null ? "—" : score}</div>
      <p class="note">hedef ${target}${score != null && score < target ? ` · ~${Math.ceil((target - score) / 1.25)} doğru daha` : ""}${p.missing ? ` · ${p.missing} bölüm verisiz` : ""}</p>

function sparkline(pts) {
  const W = 600, H = 140, L = 34, R = 26, T = 14, B = 26;
  const xs = i => pts.length === 1 ? (L + W - R) / 2 : L + i * (W - L - R) / (pts.length - 1);
  const ys = v => T + (1 - v / 100) * (H - T - B);
  const line = pts.map((p, i) => `${i ? "L" : "M"}${xs(i).toFixed(1)},${ys(p.score).toFixed(1)}`).join("");
  const area = line + `L${xs(pts.length - 1).toFixed(1)},${ys(0)}L${xs(0).toFixed(1)},${ys(0)}Z`;
  const last = pts[pts.length - 1];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="Tahmini puan geçmişi, son değer ${last.score}">

function startExam(kind, src) {

  if (qids.length < want) toast(`Havuzda ${qids.length} uygun soru var; süre buna göre ${Math.round(EXAM.st.duration / 60000)} dk.`, 4000);

    if (st.answers[q.id] === L) delete st.answers[q.id]; else st.answers[q.id] = L;
    saveExamState(); renderExamQ();
  };
  if ($("#exClear")) $("#exClear").onclick = () => { delete st.answers[q.id]; saveExamState(); renderExamQ(); };
  $("#exPrev").onclick = () => examGo(st.idx - 1);
  $("#exNext").onclick = () => examGo(st.idx + 1);
  $("#exFlag").onclick = () => { if (st.flags[q.id]) delete st.flags[q.id]; else st.flags[q.id] = true; saveExamState(); renderExamQ(); };
  $("#exGrid").onclick = examGrid;
  $("#exFinish").onclick = async () => {
    const blank = N - Object.keys(st.answers).length, fl = Object.keys(st.flags).length;
    if (await confirmBox(`Denemeyi bitirmek istiyor musun?${blank ? ` ${blank} boş soru var.` : ""}${fl ? ` ${fl} işaretli soru var.` : ""}`, "Bitir", "Devam et")) finishExam(false);
  };
  $("#exExit").onclick = async () => {
    if (await confirmBox("Ara vermek istiyor musun? Süre durur; Deneme ekranından devam edebilirsin.", "Ara ver", "Devam et")) {
      examTrack(); EXAM.st.elapsed = EXAM.base + (Date.now() - EXAM.resumed); saveExamState();
      EXAM.active = false; clearInterval(EXAM.timer); Sound.examMute = false; go("exam");
    }
  };
}
// Seviye testi raporu: bölüm başarılarını gerçek sınavdaki soru sayılarıyla tartıp tahmini puan çıkarır,
// en zayıf bölümleri sıralar ve oradan antrenmana başlatır.
function placementHtml(by, correct, total) {
  const avg = total ? correct / total : 0;
  let est = 0;
  for (const s of examSections()) est += (by[s] ? by[s][0] / by[s][1] : avg) * REAL(s) * 1.25;
  const rows = examSections().filter(s => by[s]).map(s => ({ s, acc: by[s][0] / by[s][1], n: by[s][1], gain: (1 - by[s][0] / by[s][1]) * REAL(s) }))
    .sort((a, b) => b.gain - a.gain || a.acc - b.acc);   // sınavda en çok soru kaybettiren bölüm önce
  const weak = rows.filter(r => r.acc < .75).slice(0, 3);
  return `<section class="panel stack" style="width:100%;text-align:left">
    <h3>Seviye profilin</h3>
    <p>Bu sonuçla gerçek sınavda tahmini puanın <b style="color:var(--gold)">${Math.round(est)}</b> civarında. ${total < 40 ? "28 soruluk bir test kaba bir ölçüm; birkaç gün çözdükçe tahmin netleşir." : ""}</p>
    ${weak.length ? `<p class="muted">Önce şu bölümlerden başla. Hem en çok zorlandığın hem de sınavda en çok puan getiren yerler:</p>
    <div class="stack" style="gap:8px">${weak.map(r => `<div class="weak"><span><b>${esc(SEC[r.s].tr)}</b> · %${Math.round(r.acc * 100)} (${r.n} soru)</span><button class="btn small cyan" data-act="practice:${r.s}">Antrenman</button><span class="note" style="grid-column:1/-1">Sınavda ~${Math.round(r.gain)} / ${REAL(r.s)} soru kaybettiriyor</span></div>`).join("")}</div>`
    : `<p class="muted">Bütün bölümlerde iyisin. Koşuya ve denemelere geçebilirsin.</p>`}
  </section>`;
}
function examGo(i) { const st = EXAM.st; if (i < 0 || i >= st.qids.length) return; examTrack(); st.idx = i; saveExamState(); renderExamQ(); }
function examGrid() {
  const st = EXAM.st;
  const m = modal(`<h2>Sorular</h2><p class="note">Mavi: cevaplı · turuncu nokta: işaretli · çerçeve: şu anki</p>
    <div class="egrid">${st.qids.map((id, i) => `<button data-i="${i}" class="${st.answers[id] ? "ans" : ""} ${st.flags[id] ? "flag" : ""} ${i === st.idx ? "cur" : ""}">${i + 1}</button>`).join("")}</div>
    <button class="btn block" data-close>Kapat</button>`);
  $(".egrid", m.el).onclick = e => { const b = e.target.closest("[data-i]"); if (!b) return; m.close(); examGo(+b.dataset.i); };
}
function finishExam(auto) {
  if (!EXAM.active) return;
  examTrack();
  const st = EXAM.st; EXAM.active = false; clearInterval(EXAM.timer);
  const by = {}; let correct = 0, blank = 0;
  for (const id of st.qids) {
    const q = Q(id); const ch = st.answers[id] || null;
    const a = recordAttempt(q, ch, null, st.times[id] || 0, "exam");
    if (!ch) blank++;
    if (a.correct) correct++; else srsAfterAnswer(q, false, null);
    (by[q.section] = by[q.section] || [0, 0]); by[q.section][1]++; if (a.correct) by[q.section][0]++;
  }
  const per = 100 / st.want;
  const score = Math.round(correct * per * 100) / 100;
  const used = Math.min(st.duration, EXAM.base + (Date.now() - EXAM.resumed));
  if (st.kind === "placement") Store.setSettings({ placementTs: Date.now() });
  Store.put("runs", "exam-" + Date.now(), { type: "exam", kind: st.kind, ts: Date.now(), total: st.qids.length, correct, blank, score, by, usedMs: used });
  clearExamState();
  Sound.examMute = false;
  lookupSoon(0);
  const wrong = st.qids.filter(id => st.answers[id] !== Q(id).answer).map(id => ({ qid: id, chosen: st.answers[id] || null }));
  UI.screen = "exam";
  main.innerHTML = `<div class="wrap"><div class="reward">
    <p class="eyebrow">${auto ? "Süre doldu" : "Bitti"} · ${EXAM_NAME[st.kind]}</p>
    <div class="score" style="color:${score >= 70 ? "var(--good)" : "var(--gold)"}">${fmtNum(score)}<span class="muted" style="font-size:22px"> / 100</span></div>
    <p class="muted">${correct} doğru · ${st.qids.length - correct - blank} yanlış · ${blank} boş · ${fmtHMS(used)} kullanıldı${st.want !== st.qids.length ? ` · ${st.qids.length}/${st.want} soru mevcuttu` : ""}</p>
    <p class="muted">Her doğru ${fmtNum(per)} puan. ${score >= 70 ? "Hedef 70'in üstündesin!" : `70 için ${Math.max(0, Math.ceil(70 / per) - correct)} doğru daha gerekiyordu.`}</p>
    ${st.kind === "placement" ? placementHtml(by, correct, st.qids.length) : ""}
    <section class="panel" style="width:100%;text-align:left"><h3>Bölüm dökümü</h3><div class="tblwrap"><table class="tbl"><thead><tr><th>Bölüm</th><th class="n">Doğru</th><th class="n">%</th></tr></thead><tbody>
      ${SECTIONS.filter(s => by[s]).map(s => `<tr><td>${esc(SEC[s].tr)}</td><td class="n">${by[s][0]}/${by[s][1]}</td><td class="n">${pct(by[s][0], by[s][1])}</td></tr>`).join("")}
    </tbody></table></div></section>
  </div></div>
  <div class="actionbar"><div class="wrap">${wrong.length ? `<button class="btn primary" id="exRev">Hataları incele (${wrong.length})</button>` : ""}<button class="btn" id="exHome">Tamam</button></div></div>`;
  window.scrollTo(0, 0);
  bindActions(main);
  if ($("#exRev")) $("#exRev").onclick = () => startInspect(wrong, "Deneme incelemesi");
  $("#exHome").onclick = () => go("exam");
}

/* =========================================================
   13. Kelime kartları
   ========================================================= */
let _vocabIdx = null;
function vocabIndex() {
  if (_vocabIdx) return _vocabIdx;
  const m = new Map();
  for (const d of Object.values(Store.words)) {   // senin işaretlediklerin
    if (!d.tr || !(d.qids || []).length) continue;
    const en = d.en || d.word; const key = safeId(en);
    if (!m.has(key)) m.set(key, { key, en, tr: d.tr, qids: d.qids.slice(), mine: true, ctx: d.ctx, word: d.word });
  }
  for (const q of POOL.values()) for (const v of q.vocab || []) {
    if (!v || !v.en || !v.tr) continue;
    const key = safeId(v.en);
    if (!m.has(key)) m.set(key, { key, en: v.en, tr: v.tr, qids: [] });
    m.get(key).qids.push(q.id);
  }
  return (_vocabIdx = m);
}
const VOC = { tok: 0 };
function startVocab() {
  const words = [...vocabIndex().values()]; const now = Date.now();
  const due = words.filter(w => { const e = Store.srs["v:" + w.key]; return e && e.box < 4 && now >= (e.due || 0); }).sort((a, b) => Store.srs["v:" + a.key].due - Store.srs["v:" + b.key].due);
  const fresh = words.filter(w => !Store.srs["v:" + w.key]);
  const wrongQ = w => w.qids.some(id => { const la = lastAttempt(id); return la && !la.correct; });
  const deck = [...due, ...shuffle(fresh.filter(w => w.mine)), ...shuffle(fresh.filter(w => !w.mine && wrongQ(w))), ...shuffle(fresh.filter(w => !w.mine && !wrongQ(w)))].slice(0, Math.max(20, due.length)).slice(0, 30);
  if (!deck.length) return toast("Kelime kartı yok.");
  Object.assign(VOC, { deck: deck.map(w => ({ key: w.key, n: 0 })), i: 0, known: 0, unknown: 0, done: false });
  PLAY.active = true; PLAY.mode = "vocab"; setPlaying(true);
  renderVocab();
}
function vocabContext(w) {
  const hl = (s, root) => { const i = s.toLowerCase().indexOf(root); return i < 0 ? esc(s) : esc(s.slice(0, i)) + "<mark>" + esc(s.slice(i, i + root.length)) + "</mark>" + esc(s.slice(i + root.length)); };
  if (w.ctx) return hl(w.ctx, String(w.word || w.en).toLowerCase());
  for (const id of w.qids) {
    const q = Q(id); if (!q) continue;
    const texts = [q.stem, q.passage && PASSAGES.get(q.passage) && PASSAGES.get(q.passage).text, ...LETTERS.map(L => q.options[L])];
    const root = w.en.toLowerCase().split(/[\s/(]/)[0].replace(/[^a-z'-]/g, "").slice(0, Math.max(4, w.en.length - 2));
    for (const t of texts) {
      if (!t || !root) continue;
      const s = String(t).split(/(?<=[.!?])\s+/).find(x => x.toLowerCase().includes(root));
      if (s) return hl(s, root);
    }
  }
  return "";
}
// Çeldiriciler: diğer kelimelerin Türkçe karşılıkları. Fiile fiil ("-mak/-mek"), diğerine diğer;
// uzunluğu yakın olanlar ve doğru cevapla kelime paylaşmayanlar seçilir.
const TR_STOP = new Set(["etmek", "olmak", "yapmak", "olan", "olarak", "için", "gibi", "kılmak", "edilmek", "bulunmak", "vermek", "getirmek", "haline", "şekilde", "biçimde"]);
const trFirst = t => String(t).split(/[,;/(]/)[0].trim().toLowerCase();
const trKind = t => /m[ae]k$/.test(trFirst(t)) ? "v" : "o";
const trToks = t => String(t).toLowerCase().split(/[^\p{L}]+/u).filter(x => x.length > 3 && !TR_STOP.has(x));
function vocabChoices(w) {
  const kind = trKind(w.tr); const own = new Set(trToks(w.tr));
  const cand = shuffle([...vocabIndex().values()].filter(x => x.key !== w.key && x.tr && x.en.toLowerCase() !== w.en.toLowerCase() && !trToks(x.tr).some(t => own.has(t))));
  const same = cand.filter(x => trKind(x.tr) === kind).slice(0, 30).sort((a, b) => Math.abs(a.tr.length - w.tr.length) - Math.abs(b.tr.length - w.tr.length));
  const picked = []; const seen = new Set([w.tr.toLowerCase()]);
  for (const x of [...same, ...cand]) { const k = x.tr.toLowerCase(); if (seen.has(k)) continue; seen.add(k); picked.push(x.tr); if (picked.length === 3) break; }
  return shuffle([{ tr: w.tr, ok: true }, ...picked.map(tr => ({ tr, ok: false }))]);
}
function renderVocab() {
  if (VOC.i >= VOC.deck.length) {
    PLAY.active = false;
    return summaryScreen("Kartlar bitti", VOC.known >= VOC.unknown, `<div class="score">${VOC.known}<span class="muted" style="font-size:22px"> / ${VOC.known + VOC.unknown}</span></div><p class="muted">kelimeyi ilk seferde doğru bildin. Bilemediklerin yarın tekrar gelecek.</p>`, []);
  }
  const c = VOC.deck[VOC.i]; const w = vocabIndex().get(c.key); const e = Store.srs["v:" + c.key];
  if (!w) { VOC.i++; return renderVocab(); }
  c.ch = vocabChoices(w); VOC.done = false;
  main.innerHTML = `<div class="hud"><div class="wrap"><div class="hud-top">
      <button class="iconbtn" id="vQuit" aria-label="Kartları kapat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <div class="hud-title"><div class="g">Kelime kartları</div><div class="s">${VOC.i + 1}/${VOC.deck.length} · ${e ? "tekrar · kutu " + e.box : "yeni"}</div></div>
    </div></div></div>
    <div class="wrap play vwrap">
      <div class="vq"><span class="eyebrow">${w.mine ? "Senin işaretlediğin" : "Sorulardan"}</span><div class="vw">${esc(w.en)}</div><span class="note">Türkçe karşılığı hangisi? (1-4)</span></div>
      <div class="opts" id="vOpts">${c.ch.map((x, i) => `<button class="opt" data-i="${i}"><span class="L">${i + 1}</span><span class="T">${esc(x.tr)}</span></button>`).join("")}</div>
      <div class="stack" id="vFb" style="margin-top:14px"></div>
    </div>
    <div class="actionbar"><div class="wrap" id="vAct"><button class="btn" id="vSkip">Bilmiyorum</button></div></div>`;
  Sound.flip();
  window.scrollTo(0, 0);
  $("#vOpts").onclick = ev => { const b = ev.target.closest("[data-i]"); if (b) vocabAnswer(+b.dataset.i); };
  $("#vSkip").onclick = () => vocabAnswer(-1);
  $("#vQuit").onclick = () => { VOC.tok++; PLAY.active = false; go(UI.screen); };
}
function vocabAnswer(i) {
  if (VOC.done) return; VOC.done = true;
  const c = VOC.deck[VOC.i]; const w = vocabIndex().get(c.key); const id = "v:" + c.key; const e = Store.srs[id]; const now = Date.now();
  const knew = i >= 0 && c.ch[i].ok;
  if (c.n === 0) knew ? VOC.known++ : VOC.unknown++;
  c.n++;
  if (knew) {
    const nb = e ? Math.min(4, e.box + 1) : 2;
    Store.put("srs", id, { kind: "v", en: w.en, tr: w.tr, box: nb, due: nb >= 4 ? null : startOfDay(now) + BOX_DAYS[nb] * DAY, last: now });
    Sound.correct(1); vibrate(30);
  } else {
    Store.put("srs", id, { kind: "v", en: w.en, tr: w.tr, box: 0, due: now, last: now });
    if (c.n < 3) VOC.deck.splice(Math.min(VOC.deck.length, VOC.i + 5), 0, { key: c.key, n: c.n });
    Sound.wrong(); vibrate([60, 40, 60]);
  }
  $$("#vOpts .opt").forEach((b, j) => { b.setAttribute("aria-disabled", "true"); b.classList.add(c.ch[j].ok ? "correct" : j === i ? "wrong" : "dim"); });
  const ctx = vocabContext(w);
  $("#vFb").innerHTML = `<div class="fb-head ${knew ? "good" : "bad"}"><span class="ic">${knew ? "✓" : "✗"}</span><div><div class="ttl">${knew ? "Doğru!" : i < 0 ? "Bir dahakine" : "Yanlış"}</div><div class="sub"><b>${esc(w.en)}</b> = ${esc(w.tr)}${knew ? "" : " · birkaç kart sonra tekrar gelecek"}</div></div></div>
    ${ctx ? `<div class="fb-block"><h4>Geçtiği cümle</h4><p>${ctx}</p></div>` : ""}`;
  $("#vAct").innerHTML = `<button class="btn primary" id="vNext">Devam ▶</button>`;
  $("#vNext").onclick = vocabNext; $("#vNext").focus({ preventScroll: true });
  if (knew) { const tok = ++VOC.tok; setTimeout(() => { if (VOC.tok === tok) vocabNext(); }, 1400); }
}
function vocabNext() {
  if (!VOC.done || PLAY.mode !== "vocab" || !PLAY.active) return;
  VOC.tok++; VOC.i++; renderVocab();
}

/* =========================================================
   14. Açılış
   ========================================================= */
$$(".nav button").forEach(b => b.addEventListener("click", () => go(b.dataset.go)));
// Her tıklamada kısa bir "tık". Sonucu kendi sesiyle duyulan düğmeler (güven, kelime kartı şıkları,
// kelime işaretleme) ve sessiz deneme modu hariç.
document.addEventListener("click", e => {
  if (EXAM.active || !e.target.closest) return;
  const t = e.target.closest("button, summary, a, select, .switch, [role=button], [data-gate]");
  if (!t || t.getAttribute("aria-disabled") === "true" || t.matches("[data-conf], #vOpts .opt")) return;
  if (MARK.on && e.target.closest(".w") && markTarget()) return;
  Sound.click();
}, true);
$("#btnSettings").addEventListener("click", openSettings);
function firstGesture() {
  document.removeEventListener("pointerdown", firstGesture, true);
  document.removeEventListener("keydown", firstGesture, true);
  if (Sound.ensure()) { Sound.setVolume(S().volume ?? .6); Sound.setTrack(PLAY.run && PLAY.run.gate ? PLAY.run.gate.section : "lobby"); Sound.sync(); }
}
document.addEventListener("pointerdown", firstGesture, true);
document.addEventListener("keydown", firstGesture, true);
document.addEventListener("visibilitychange", () => { if (!Sound.ctx) return; if (document.hidden) Sound.ctx.suspend(); else Sound.ctx.resume(); });

(async function boot() {
  Store.load(); applyTheme();
  const cl = window.claude;
  if (cl && typeof cl.use === "function") {
    Promise.race([cl.use("sample"), sleep(10000).then(() => null)]).then(s => { SAMPLE = s || null; refreshAiBox(); }).catch(() => {});
  }
  const dbP = Store.connect();
  await loadData();
  render();
  if (!POOL.size) main.innerHTML = `<div class="wrap"><div class="empty">Soru verisi yüklenemedi. data/manifest.json dosyasını kontrol et.</div></div>`;
  await dbP;
  _attVer = -1; bump(); applyTheme();
  if (!PLAY.active && !EXAM.active) render(); else updateTop();
  if (!G() && !S().goalAsked && !PLAY.active && !EXAM.active && !$(".overlay")) openGoal(true);
})();
